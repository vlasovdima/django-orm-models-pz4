<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            border: 1px solid #e1e4e8;
        }
        h1 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 24px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
        }
        form p {
            margin-bottom: 16px;
        }
        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #495057;
        }
        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        button[type="submit"] {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background-color: #004494;
        }
        .info-box {
            margin-top: 20px;
            padding: 12px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 13px;
            color: #495057;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Вход в систему</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Войти
        </button>
    </form>
    <div class="info-box">
        Учебный проект: <strong>django_auth</strong><br>
        Пользователь: <code>student1</code> / Пароль: <code>Student123!</code>
    </div>
</div>
</body>
</html>
