<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курсы</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            border: 1px solid #e1e4e8;
        }
        h1 {
            margin-top: 0;
            color: #0c4b33;
            font-size: 26px;
            border-bottom: 2px solid #0c4b33;
            padding-bottom: 12px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 20px 0;
        }
        li {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-left: 4px solid #0c4b33;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-size: 16px;
            line-height: 1.5;
        }
        .course-title {
            font-weight: 600;
            color: #1a1a1a;
        }
        .course-dep {
            color: #0056b3;
            font-weight: 500;
        }
        .course-desc {
            display: block;
            margin-top: 6px;
            font-size: 13.5px;
            color: #555555;
        }
        .back-link {
            display: inline-block;
            margin-top: 12px;
            background-color: #0056b3;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .back-link:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Список курсов</h1>

    <ul>
        {% for course in courses %}
            <li>
                <span class="course-title">{{ course.title }}</span>
                —
                <span class="course-dep">{{ course.department.name }}</span>
                {% if course.description %}
                    <span class="course-desc">{{ course.description }}</span>
                {% endif %}
            </li>
        {% empty %}
            <li>Курсов пока нет.</li>
        {% endfor %}
    </ul>

    <a href="/profile/" class="back-link">
        Профиль
    </a>
</div>
</body>
</html>
